method: grid
metric:
  goal: maximize
  name: validation/balanced_accuracy
parameters:
  # Training-only weight-density strata; not passed to the critic.
  balance_strata:
    values: [20]
  val_split:
    values: [0.1]
  # training
  epochs:
    values: [100]
  critic_steps:
    values: [1, 3]
  batch_size:
    values: [2048]
  lr:
    values: [0.0001]
  weight_decay:
    values: [0.005]
  cosine:
    values: [1]
  optimizer:
    values: [adam]
  # Continuous density-ratio objective
  lambda_info:
    values: [1]
  # contrastive
  contrast_weight:
    values: [0.0]
  contrast_temp:
    values: [0.05]
  # model architecture
  embed_size:
    values: [128]
  latent_dim:
    values: [6]
  proj_dim:
    values: [6]
  num_heads:
    values: [8]
  num_layers:
    values: [4]
  dim_ff:
    values: [512]
  linear_dim:
    values: [16]
  # seeds
  manualSeed:
    values: [0, 1, 2]
  project_name:
    values: [hlt]
program: train_hlt.py
project: hlt_nurd_con
