method: grid
metric:
  goal: minimize
  name: Val/proxy_abcd_score
parameters:
  # data
  n_bins:
    values: [20]
  nuisance_bin_scope:
    values: [qcd]
  baseline_labels:
    values: ["0,1,2,3"]
  val_split:
    values: [0.1]
  # training
  epochs:
    values: [200]
  critic_epochs:
    values: [2]
  batch_size:
    values: [4096]
  lr:
    values: [0.0001]
  weight_decay:
    values: [0.005]
  cosine:
    values: [1]
  optimizer:
    values: [adam]
  # NURD flags
  reweight:
    values: [1]
  joint_indep:
    values: [1]
  _lambda:
    values: [0.01]
  critic_schedule:
    values: [warmup]
  critic_type:
    values: [density_ratio]
  critic_penalty_type:
    values: [ratio_to_one]
  critic_scope:
    values: [qcd]
  critic_shuffle:
    values: [global]
  critic_train_frac:
    values: [1.0]
  n_critic_steps_per_batch:
    values: [1]
  max_weight_ratio:
    values: [10.0]
  closure_loss_type:
    values: [hybrid]
  closure_scope:
    values: [qcd]
  closure_class_min_events:
    values: [20]
  closure_score_mode:
    values: [own_class]
  closure_weight:
    values: [1.0]
  closure_weight_start:
    values: [0.0]
  closure_ramp_epochs:
    values: [15]
  closure_corr_weight:
    values: [0.25]
  closure_dcorr_weight:
    values: [1.0]
  closure_profile_weight:
    values: [0.5]
  closure_reverse_profile_weight:
    values: [0.5]
  closure_profile_bins:
    values: [8]
  closure_profile_tail_weight:
    values: [2.0]
  closure_dcorr_max_samples:
    values: [512]
  closure_tail_abcd_weight:
    values: [1.0]
  closure_tail_quantiles:
    values: ["0.50,0.65,0.80,0.90"]
  closure_tail_scale:
    values: [12.0]
  closure_tail_min_events:
    values: [5]
  closure_tail_focus_weight:
    values: [2.0]
  abcd_ckpt_loss_tol:
    values: [1.10]
  val_abcd_quantiles:
    values: ["0.50,0.55,0.60,0.65,0.70,0.75,0.80,0.85,0.90,0.92"]
  val_abcd_min_events:
    values: [20]
  val_abcd_min_region_frac:
    values: [0.005]
  md_proxy_type:
    values: [ema]
  md_ema_momentum:
    values: [0.05]
  # contrastive
  contrast_weight:
    values: [0.02]
  contrast_weight_start:
    values: [0.15]
  contrast_ramp_epochs:
    values: [40]
  contrast_temp:
    values: [0.05]
  # model architecture
  embed_size:
    values: [128]
  latent_dim:
    values: [6]
  proj_dim:
    values: [6]
  num_heads:
    values: [8]
  num_layers:
    values: [4]
  dim_ff:
    values: [512]
  linear_dim:
    values: [16]
  # seeds
  manualSeed:
    values: [0, 1, 2]
  project_name:
    values: [hlt]
program: train_hlt.py
project: hlt_nurd_con
