apiVersion: batch/v1
kind: Job
metadata:
  name: train-hlt-stable-closure
  namespace: axol1tl
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
      containers:
        - name: train
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "=== Job started: $(date) ==="
              python -c "import torch; print('CUDA:', torch.cuda.is_available(), '| Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'CPU')"

              pip install --quiet -r /axovol/contrastive_axis/hlt_nurd_con/nrp/requirements_nrp.txt

              export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

              cd /axovol/contrastive_axis/hlt_nurd_con

              DATA=/axovol/contrastive_axis/data/hlt_smcocktail_mequinna_train.pt
              GEN_WEIGHTS=/axovol/contrastive_axis/data/weight_train.pt
              AE_CKPT=checkpoints/hlt/hlt/ae_engineer_continuous/checkpoint_ae.pth

              echo "=== NURD stable-closure training: $(date) ==="
              python train_hlt.py \
                --data         $DATA \
                --gen_weight_path $GEN_WEIGHTS \
                --ae_ckpt      $AE_CKPT \
                --epochs       40 \
                --batch_size   4096 \
                --lr           1e-4 \
                --weight_decay 5e-3 \
                --balance_strata 20 \
                --contrast_weight 0.0 \
                --contrast_temp   0.05 \
                --embed_size   128 \
                --latent_dim   6 \
                --proj_dim     6 \
                --num_heads    8 \
                --num_layers   4 \
                --dim_ff       512 \
                --linear_dim   16 \
                --critic_lr    1e-3 \
                --critic_steps 3 \
                --lambda_info  1.0 \
                --qcd_label      1 \
                --exp_name     hlt_nurd_engineer_continuous \
                --project_name hlt \
                --manualSeed   42

              echo "=== NURD stable-closure training done: $(date) ==="
          env:
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-secret
                  key: WANDB_API_KEY
          resources:
            requests:
              memory: "64Gi"
              cpu: "8"
              nvidia.com/a100: "1"
            limits:
              memory: "128Gi"
              cpu: "16"
              nvidia.com/a100: "1"
          volumeMounts:
            - name: axovol
              mountPath: /axovol
      volumes:
        - name: axovol
          persistentVolumeClaim:
            claimName: axovol
